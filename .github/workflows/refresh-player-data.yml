name: Refresh player data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: Provider set to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - liquipedia
          - pandascore
          - balldontlie
          - bo3
      skip_majors:
        description: Skip the Liquipedia Major database
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: player-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and review player data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select snapshot image
        id: snapshot
        shell: bash
        run: |
          owner=$(tr '[:upper:]' '[:lower:]' <<<"${GITHUB_REPOSITORY_OWNER}")
          image="ghcr.io/${owner}/cs-guess-data"
          tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Restore previous canonical database
        shell: bash
        env:
          SNAPSHOT_IMAGE: ${{ steps.snapshot.outputs.image }}
        run: |
          if ! docker pull "${SNAPSHOT_IMAGE}:latest"; then
            echo "No previous GHCR snapshot exists; starting from repository data."
            exit 0
          fi

          container_id=$(docker create "${SNAPSHOT_IMAGE}:latest" /bin/true)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/snapshot/." .

      - name: Configure data providers
        shell: bash
        env:
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
          BALLDONTLIE_API_TOKEN: ${{ secrets.BALLDONTLIE_API_TOKEN }}
          LIQUIPEDIA_USER_AGENT: ${{ vars.LIQUIPEDIA_USER_AGENT }}
          REQUESTED_SOURCE: ${{ inputs.source || 'all' }}
        run: |
          if [[ -z "$PANDASCORE_API_TOKEN" ]]; then
            echo "PANDASCORE_API_TOKEN is not configured." >&2
            exit 1
          fi
          if [[ -z "$LIQUIPEDIA_USER_AGENT" ]]; then
            echo "LIQUIPEDIA_USER_AGENT is not configured." >&2
            exit 1
          fi
          if [[ "$REQUESTED_SOURCE" == "balldontlie" && -z "$BALLDONTLIE_API_TOKEN" ]]; then
            echo "BALLDONTLIE_API_TOKEN is required for a BALLDONTLIE-only refresh." >&2
            exit 1
          fi

          umask 077
          {
            printf 'PANDASCORE_API_TOKEN=%s\n' "$PANDASCORE_API_TOKEN"
            printf 'BALLDONTLIE_API_TOKEN=%s\n' "$BALLDONTLIE_API_TOKEN"
            printf 'LIQUIPEDIA_USER_AGENT=%s\n' "$LIQUIPEDIA_USER_AGENT"
            printf 'ALLOW_HLTV_FALLBACK=false\n'
          } > .env

      - name: Refresh canonical data
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source || 'all' }}
          SKIP_MAJORS: ${{ inputs.skip_majors || false }}
        run: |
          args=(
            sync
            --source "$REQUESTED_SOURCE"
            --db scraper/data/cs_guess.sqlite
            --output scraper/data/players.game.json
            --report scraper/data/sync-report.json
            --catalog-output src/data/players.generated.json
            --catalog-metadata-output src/data/players.generated.meta.json
            --reviewed-identity-merges scraper/identity-merges.reviewed.json
            --reviewed-source-quarantines scraper/source-quarantines.reviewed.json
            --reviewed-identity-separations scraper/identity-separations.reviewed.json
            --reviewed-major-winners scraper/reviewed-major-winners.json
            --reviewed-major-appearances scraper/reviewed-major-appearances.json
            --reviewed-player-overrides scraper/reviewed-player-overrides.json
            --reviewed-role-overrides scraper/reviewed-role-overrides.json
            --liquipedia-max-retries 10
            --liquipedia-rate-limit-retry-delay 60
          )
          if [[ "$SKIP_MAJORS" == "true" ]]; then
            args+=(--skip-majors)
          fi
          uv run --project scraper --frozen cs-guess-scraper "${args[@]}"

      - name: Collect data quality
        id: quality
        shell: bash
        run: |
          uv run --project scraper --frozen cs-guess-scraper quality \
            --db scraper/data/cs_guess.sqlite \
            --output scraper/data/data-quality-report.json
          uv run --project scraper --frozen cs-guess-scraper audit \
            --db scraper/data/cs_guess.sqlite \
            > scraper/data/audit-report.json

          critical_issues=$(jq --raw-output '.summary.criticalIssues' scraper/data/data-quality-report.json)
          open_conflicts=$(jq --raw-output '.conflicts.open' scraper/data/audit-report.json)
          warnings=$(jq --raw-output '.summary.warnings' scraper/data/data-quality-report.json)
          if [[ "$critical_issues" == "0" ]]; then
            passed=true
          else
            passed=false
            echo "::warning title=Player data needs review::${critical_issues} critical issues and ${open_conflicts} open conflicts were preserved in a draft PR candidate."
          fi
          echo "passed=${passed}" >> "$GITHUB_OUTPUT"
          echo "critical_issues=${critical_issues}" >> "$GITHUB_OUTPUT"
          echo "open_conflicts=${open_conflicts}" >> "$GITHUB_OUTPUT"
          echo "warnings=${warnings}" >> "$GITHUB_OUTPUT"

      - name: Summarize refresh
        if: always()
        shell: bash
        run: |
          if [[ ! -f scraper/data/sync-report.json ]]; then
            echo "## Player data refresh" >> "$GITHUB_STEP_SUMMARY"
            echo "The sync did not produce a report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -r '
            "## Player data refresh\n\n" +
            "| Metric | Value |\n| --- | ---: |\n" +
            "| Players | \(.dataQuality.summary.players) |\n" +
            "| Guessable players | \(.dataQuality.summary.guessablePlayers) |\n" +
            "| Open conflicts | \(.audit.conflicts.open) |\n" +
            "| Critical issues | \(.dataQuality.summary.criticalIssues) |\n" +
            "| Warnings | \(.dataQuality.summary.warnings) |"
          ' scraper/data/sync-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-data-review-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            scraper/data/sync-report.json
            scraper/data/data-quality-report.json
            scraper/data/audit-report.json
            src/data/players.generated.meta.json

      - name: Publish candidate snapshot to GHCR
        id: publish
        shell: bash
        env:
          SNAPSHOT_IMAGE: ${{ steps.snapshot.outputs.image }}
          SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
          QUALITY_PASSED: ${{ steps.quality.outputs.passed }}
        run: |
          metadata_file="$RUNNER_TEMP/player-data-image.json"
          tags=(--tag "${SNAPSHOT_IMAGE}:${SNAPSHOT_TAG}")
          if [[ "$QUALITY_PASSED" == "true" ]]; then
            tags+=(--tag "${SNAPSHOT_IMAGE}:latest")
          fi
          docker buildx build \
            --file scraper/Dockerfile.snapshot \
            --build-arg "SOURCE_REPOSITORY=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.created=$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${tags[@]}" \
            --metadata-file "$metadata_file" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            .

          digest=$(jq --raw-output '."containerimage.digest"' "$metadata_file")
          if [[ -z "$digest" || "$digest" == "null" ]]; then
            echo "The snapshot build did not report a registry digest." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "reference=${SNAPSHOT_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Retain latest eight data snapshots
        continue-on-error: true
        uses: actions/delete-package-versions@25ad4af5be03aef10e0b3376b248688b7a44c40b # v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: cs-guess-data
          package-type: container
          min-versions-to-keep: 8
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write candidate review manifest
        shell: bash
        env:
          SNAPSHOT_REFERENCE: ${{ steps.publish.outputs.reference }}
          QUALITY_PASSED: ${{ steps.quality.outputs.passed }}
          CRITICAL_ISSUES: ${{ steps.quality.outputs.critical_issues }}
          OPEN_CONFLICTS: ${{ steps.quality.outputs.open_conflicts }}
          QUALITY_WARNINGS: ${{ steps.quality.outputs.warnings }}
        run: |
          jq --null-input \
            --arg snapshot "$SNAPSHOT_REFERENCE" \
            --arg workflowUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg createdAt "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson passed "$QUALITY_PASSED" \
            --argjson criticalIssues "$CRITICAL_ISSUES" \
            --argjson openConflicts "$OPEN_CONFLICTS" \
            --argjson warnings "$QUALITY_WARNINGS" \
            '{
              schemaVersion: 1,
              snapshot: $snapshot,
              workflowUrl: $workflowUrl,
              runId: ($runId | tonumber),
              runAttempt: ($runAttempt | tonumber),
              createdAt: $createdAt,
              quality: {
                passed: $passed,
                criticalIssues: $criticalIssues,
                openConflicts: $openConflicts,
                warnings: $warnings
              }
            }' > scraper/player-data-candidate.json

      - name: Detect candidate review changes
        id: candidate
        shell: bash
        env:
          CRITICAL_ISSUES: ${{ steps.quality.outputs.critical_issues }}
        run: |
          if git diff --quiet -- src/data/players.generated.json && \
              [[ "$CRITICAL_ISSUES" == "0" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create candidate review pull request
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_REFERENCE: ${{ steps.publish.outputs.reference }}
          QUALITY_PASSED: ${{ steps.quality.outputs.passed }}
          CRITICAL_ISSUES: ${{ steps.quality.outputs.critical_issues }}
          OPEN_CONFLICTS: ${{ steps.quality.outputs.open_conflicts }}
        run: |
          branch="automation/player-data-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workflow_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          players=$(jq --raw-output '.dataQuality.summary.players' scraper/data/sync-report.json)
          guessable=$(jq --raw-output '.dataQuality.summary.guessablePlayers' scraper/data/sync-report.json)
          warnings=$(jq --raw-output '.dataQuality.summary.warnings' scraper/data/sync-report.json)
          if [[ "$QUALITY_PASSED" == "true" ]]; then
            quality_state="passed; this snapshot also updated the canonical latest tag"
          else
            quality_state="needs manual review; the canonical latest tag was not changed"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add -- \
            scraper/player-data-candidate.json \
            src/data/players.generated.json \
            src/data/players.generated.meta.json
          git commit -m "data: review player catalog candidate"
          git push origin "HEAD:refs/heads/${branch}"

          body_file="$RUNNER_TEMP/player-data-pr.md"
          {
            echo "## Player-data candidate"
            echo
            echo "- Players: ${players}"
            echo "- Guessable players: ${guessable}"
            echo "- Open conflicts: ${OPEN_CONFLICTS}"
            echo "- Critical issues: ${CRITICAL_ISSUES}"
            echo "- Quality warnings: ${warnings}"
            echo "- Quality state: ${quality_state}"
            echo "- Snapshot: \`${SNAPSHOT_REFERENCE}\`"
            echo "- Workflow: ${workflow_url}"
            echo
            echo "The run-specific snapshot preserves the fetched SQLite database and audit reports."
            echo "Edit the reviewed JSON decisions in this PR, then use the fast candidate-review check to replay them without fetching provider data again."
            echo "Keep this PR as a draft until the candidate-review quality gate passes."
          } > "$body_file"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "data: review player catalog candidate" \
            --body-file "$body_file" \
            --draft
