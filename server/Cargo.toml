[package]
name = "cs-guess-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
dashmap = "6.1.0"
futures-util = "0.3.31"
http = "1.4.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.18"
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.7.0", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
time = "0.3.44"

[dev-dependencies]
http-body-util = "0.1.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
